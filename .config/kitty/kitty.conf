# Font                                                                                                            
font_family JetBrainsMono Nerd Font
font_size 10
 
# Behavior
confirm_os_window_close 0

# Let the shell/prompt not override the cursor
shell_integration no-cursor
 
# Theme colors (matugen); keep this above the cursor settings
include matugen.conf

# Block cursor
cursor_shape block
cursor_shape_unfocused hollow

# Blink: gentle fade
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0
 
# Cursor trail: tight and quick, on every move
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 0

# Frame pacing
sync_to_monitor yes
