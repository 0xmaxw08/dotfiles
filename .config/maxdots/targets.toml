# Each target: input template -> output file. Optional `reload` is an argv list
# that runs once after ALL targets were written successfully.

[kitty]
input  = "~/.config/maxdots/templates/kitty.conf"
output = "~/.config/kitty/matugen.conf"
reload = ["pkill", "-USR1", "-x", "kitty"]

[rofi]
input  = "~/.config/maxdots/templates/rofi-colors.rasi"
output = "~/.config/rofi/colors.rasi"

[hyprlock]
input  = "~/.config/maxdots/templates/hyprlock-colors.conf"
output = "~/.config/hypr/hyprlock-colors.conf"

[gtk3]
input  = "~/.config/maxdots/templates/gtk-colors.css"
output = "~/.config/gtk-3.0/colors.css"

[gtk4]
input  = "~/.config/maxdots/templates/gtk-colors.css"
output = "~/.config/gtk-4.0/colors.css"

[quickshell]
input  = "~/.config/maxdots/templates/quickshell-theme.json"
output = "~/.cache/maxdots/quickshell-theme.json"

[btop]
input  = "~/.config/maxdots/templates/btop.theme"
output = "~/.config/btop/themes/maxdots.theme"
reload = ["pkill", "-USR2", "-x", "btop"]

[cava]
input  = "~/.config/maxdots/templates/cava-theme"
output = "~/.config/cava/themes/maxdots"
reload = ["pkill", "-USR2", "-f", "-x", "cava"]

[hypr]
input  = "~/.config/maxdots/templates/hypr-colors.lua"
output = "~/.config/hypr/colors.lua"
reload = ["hyprctl", "reload"]
