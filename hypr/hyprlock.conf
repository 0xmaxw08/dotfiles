background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(35, 35, 35, 0.8)
    inner_color = rgba(10, 10, 10, 0.9)
    font_color = rgb(212, 212, 212)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1)
    font_size = 64
    font_family = Hack Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
